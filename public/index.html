<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FlytBase | Account intelligence</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">F</span> FlytBase <span class="product">Customer Success</span></div>
    <button id="sync" disabled>Sync evidence</button>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <label for="accounts">Accounts</label>
      <select id="accounts" disabled><option>Loading accounts…</option></select>
      <nav aria-label="Account sections" id="sections" hidden>
        <a href="#book">Book value</a>
        <a href="#people">Stakeholders</a>
        <a href="#actions">Priority actions</a>
        <a href="#risks">Risks &amp; deadlines</a>
        <a href="#unknowns">Open questions</a>
        <a href="#evidence">Source records</a>
      </nav>
    </aside>
    <main>
      <div class="intro">
        <h1>Account intelligence</h1>
        <p id="status" role="status">Loading account evidence…</p>
      </div>
      <div id="app" aria-busy="true"></div>
      <div id="signals"></div>
    </main>
  </div>
  <template id="account">
    <section class="account">
      <div class="account-head"><div><p class="eyebrow">Account overview</p><h2></h2></div><span class="source"></span></div>
      <div class="grid"></div>
      <details id="evidence"><summary>Inspect original account evidence</summary><pre></pre></details>
    </section>
  </template>
</body>
</html>
